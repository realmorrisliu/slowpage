# Push of this file, or of the Rust product tree, is the trigger.
# workflow_dispatch is not used: this file is not on the default branch.
# baseline runs only for the commit that introduced it.
# The published spike-shell stays e1daf10 unless Rust sources or package
# manifests differ from that commit. A script-only change must not upload a
# new spike-shell. spike-measure is built from that same product commit when
# the tree matches, and from the push sha when it does not.
name: Bold baseline fdd8183

on:
  push:
    branches:
      - cursor/shell-form-tokens-d356
    paths:
      - .github/workflows/bold-baseline-fdd8183.yml
      - rust-toolchain.toml
      - spikes/**
      - crates/**

concurrency:
  group: bold-baseline-fdd8183
  cancel-in-progress: false

jobs:
  baseline:
    if: github.sha == '25922152c63f33abd64a327067f475e60b0e9b14'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fdd8183c5d43e0fbf623c188eebf29551254ab03
          fetch-depth: 1

      - name: Require the historical commit and an arm64 runner
        run: |
          set -euo pipefail
          want=fdd8183c5d43e0fbf623c188eebf29551254ab03
          got=$(git rev-parse HEAD)
          echo "source_sha ${got}"
          test "$got" = "$want"
          test -z "$(git status --porcelain)"
          echo "arch $(uname -m)"
          uname -a
          sw_vers
          test "$(uname -m)" = "arm64"

      - name: Install the toolchain pinned by that commit
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustc --version
          rustc -vV
          cargo --version
          cargo -vV
          test "$(rustc --version | awk '{print $2}')" = "1.98.1"

      - name: Build release spike-shell without editing the tree
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fdd8183-target
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          cargo build --manifest-path spikes/Cargo.toml -p spike-shell --release
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "fdd8183c5d43e0fbf623c188eebf29551254ab03"

      - name: Record identity, architecture, and linked libraries
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fdd8183-target
        run: |
          set -euo pipefail
          bin="${CARGO_TARGET_DIR}/release/spike-shell"
          test -f "$bin"
          out="${RUNNER_TEMP}/baseline-provenance"
          mkdir -p "$out"
          cp "$bin" "$out/spike-shell"
          {
            echo "source_sha $(git rev-parse HEAD)"
            echo "source_subject $(git log -1 --format=%s)"
            echo "rustc $(rustc --version)"
            rustc -vV
            echo "cargo $(cargo --version)"
            cargo -vV
            echo "runner_arch $(uname -m)"
            uname -a
            sw_vers
            echo "host_target $(rustc -vV | awk '/^host:/{print $2}')"
            echo "binary_sha256 $(shasum -a 256 "$bin" | awk '{print $1}')"
            file "$bin"
            echo "--- otool -L ---"
            otool -L "$bin"
            echo "--- LC_BUILD_VERSION ---"
            otool -l "$bin" | awk '
              $1 == "cmd" && $2 == "LC_BUILD_VERSION" { show = 1 }
              show && $1 == "cmd" && $2 != "LC_BUILD_VERSION" { show = 0 }
              show { print }
            '
          } > "$out/provenance.txt"
          # A usable Mac baseline links only system libraries. Anything else
          # stays in the artifact, and the job fails so it is not called ready.
          otool -L "$bin" | awk 'NR > 1 && $1 != "" { print $1 }' > "$out/libs.txt"
          bad=0
          while IFS= read -r lib; do
            case "$lib" in
              /usr/lib/*|/System/Library/*) ;;
              *)
                echo "not a system library: $lib"
                bad=1
                ;;
            esac
          done < "$out/libs.txt"
          if [ "$bad" -ne 0 ]; then
            echo "usable_on_mac no" | tee -a "$out/provenance.txt"
            echo "The binary needs a library that is not in this artifact." | tee -a "$out/provenance.txt"
            exit 1
          fi
          echo "usable_on_mac yes_if_os_at_least_minos_not_launched" | tee -a "$out/provenance.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-shell-fdd8183
          path: ${{ runner.temp }}/baseline-provenance
          if-no-files-found: warn

  product:
    if: github.sha != '25922152c63f33abd64a327067f475e60b0e9b14'
    runs-on: macos-latest
    outputs:
      rebuild: ${{ steps.decide.outputs.rebuild }}
      measure_ref: ${{ steps.decide.outputs.measure_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Compare product Rust with the published candidate
        id: decide
        run: |
          set -euo pipefail
          published=e1daf10bee77ecb24eb9e072c2d815e7ce86406b
          git fetch --depth 1 origin "$published"
          echo "workflow_sha $(git rev-parse HEAD)"
          echo "published_shell_source ${published}"
          echo "published_shell_sha256 61a4192996b99d44c9f3f618ba60273e1ab297b68908d5c004c664a5582ee95b"
          set +e
          git diff --name-only "$published" HEAD -- rust-toolchain.toml spikes crates > "${RUNNER_TEMP}/product-names"
          state=$?
          set -e
          if [ "$state" -gt 1 ]; then
            exit "$state"
          fi
          relevant=$(grep -E '(^|/)(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml)$|\.rs$' "${RUNNER_TEMP}/product-names" || true)
          if [ -z "$relevant" ]; then
            echo "product_rust_matches ${published}"
            echo "spike-shell not rebuilt"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "measure_ref=${published}" >> "$GITHUB_OUTPUT"
          else
            echo "product_rust_differs ${published}"
            echo "$relevant"
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "measure_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  candidate:
    needs: product
    if: needs.product.result == 'success' && needs.product.outputs.rebuild == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Require this push's branch head on arm64
        run: |
          set -euo pipefail
          got=$(git rev-parse HEAD)
          echo "role candidate"
          echo "event ${{ github.event_name }}"
          echo "source_sha ${got}"
          echo "github_sha ${{ github.sha }}"
          test "$got" = "${{ github.sha }}"
          test "$got" != "fdd8183c5d43e0fbf623c188eebf29551254ab03"
          test -z "$(git status --porcelain)"
          test "$(uname -m)" = "arm64"
          uname -a
          sw_vers

      - name: Install the toolchain pinned by this commit
        run: |
          set -euo pipefail
          channel=$(awk -F'"' '/^channel/{print $2; exit}' rust-toolchain.toml)
          echo "pinned_channel ${channel}"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
          rustc --version
          rustc -vV
          cargo --version
          cargo -vV
          test "$(rustc --version | awk '{print $2}')" = "$channel"

      - name: Release spike-shell, then the shell decision tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/candidate-target
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          cargo build --manifest-path spikes/Cargo.toml -p spike-shell --release
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain)"
          log="${RUNNER_TEMP}/shell-tests.log"
          cargo test -p spike-shell --lib --manifest-path spikes/Cargo.toml -- --test-threads=1 \
            a_stored_page_does_not_open_the_shelf_launch \
            an_explicit_file_resumes_its_stored_page \
            a_reader_forcing_launch_is_not_the_shelf_and_does_not_take_the_place \
            a_later_pass_keeps_the_origin_and_an_unmarked_pass_stays_unreported \
            fullscreen_waits_until_the_window_is_up_and_does_not_toggle_twice \
            | tee "$log"
          for name in \
            a_stored_page_does_not_open_the_shelf_launch \
            an_explicit_file_resumes_its_stored_page \
            a_reader_forcing_launch_is_not_the_shelf_and_does_not_take_the_place \
            a_later_pass_keeps_the_origin_and_an_unmarked_pass_stays_unreported \
            fullscreen_waits_until_the_window_is_up_and_does_not_toggle_twice
          do
            grep -E "test .*(::)?${name} \\.\\.\\. ok$" "$log"
          done

      - name: Record identity, architecture, and linked libraries
        if: always()
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/candidate-target
        run: |
          set -euo pipefail
          bin="${CARGO_TARGET_DIR}/release/spike-shell"
          out="${RUNNER_TEMP}/candidate-provenance"
          mkdir -p "$out"
          if [ -f "${RUNNER_TEMP}/shell-tests.log" ]; then
            cp "${RUNNER_TEMP}/shell-tests.log" "$out/shell-tests.log"
          fi
          if [ ! -f "$bin" ]; then
            echo "role candidate" > "$out/provenance.txt"
            echo "source_sha $(git rev-parse HEAD)" >> "$out/provenance.txt"
            echo "release_binary absent" >> "$out/provenance.txt"
            exit 1
          fi
          cp "$bin" "$out/spike-shell"
          {
            echo "role candidate"
            echo "event push"
            echo "source_sha $(git rev-parse HEAD)"
            echo "source_subject $(git log -1 --format=%s)"
            echo "not_baseline_sha fdd8183c5d43e0fbf623c188eebf29551254ab03"
            echo "not_a_pull_request_merge_ref"
            echo "rustc $(rustc --version)"
            rustc -vV
            echo "cargo $(cargo --version)"
            cargo -vV
            echo "runner_arch $(uname -m)"
            uname -a
            sw_vers
            echo "host_target $(rustc -vV | awk '/^host:/{print $2}')"
            echo "binary_sha256 $(shasum -a 256 "$bin" | awk '{print $1}')"
            file "$bin"
            echo "--- otool -L ---"
            otool -L "$bin"
            echo "--- LC_BUILD_VERSION ---"
            otool -l "$bin" | awk '
              $1 == "cmd" && $2 == "LC_BUILD_VERSION" { show = 1 }
              show && $1 == "cmd" && $2 != "LC_BUILD_VERSION" { show = 0 }
              show { print }
            '
            echo "--- pdfium load rule from this commit ---"
            if otool -L "$bin" | grep -i pdfium >/dev/null; then
              echo "pdfium_linked yes"
            else
              echo "pdfium_linked no"
            fi
            grep -n "PDFIUM_LIB\|libpdfium" spikes/report/src/lib.rs || true
          } > "$out/provenance.txt"
          otool -L "$bin" | awk 'NR > 1 && $1 != "" { print $1 }' > "$out/libs.txt"
          bad=0
          while IFS= read -r lib; do
            case "$lib" in
              /usr/lib/*|/System/Library/*) ;;
              *)
                echo "not a system library: $lib" | tee -a "$out/provenance.txt"
                bad=1
                ;;
            esac
          done < "$out/libs.txt"
          if [ "$bad" -ne 0 ]; then
            echo "mach_o_system_libs_only no" | tee -a "$out/provenance.txt"
            exit 1
          fi
          echo "mach_o_system_libs_only yes" | tee -a "$out/provenance.txt"
          echo "pdfium_is_runtime PDF still needs libpdfium.dylib from SPIKE_PDFIUM, the app Frameworks directory, or /tmp/pdfium/lib. This artifact does not include it." | tee -a "$out/provenance.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-shell-candidate
          path: ${{ runner.temp }}/candidate-provenance
          if-no-files-found: warn

  measure:
    needs: product
    if: needs.product.result == 'success'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.product.outputs.measure_ref }}
          fetch-depth: 1

      - name: Require the product commit selected for spike-measure
        run: |
          set -euo pipefail
          got=$(git rev-parse HEAD)
          echo "role spike-measure"
          echo "built_source_sha ${got}"
          echo "measure_ref ${{ needs.product.outputs.measure_ref }}"
          echo "workflow_sha ${{ github.sha }}"
          test "$got" = "${{ needs.product.outputs.measure_ref }}"
          test -z "$(git status --porcelain)"
          test "$(uname -m)" = "arm64"
          uname -a
          sw_vers

      - name: Install the toolchain pinned by the product commit
        run: |
          set -euo pipefail
          channel=$(awk -F'"' '/^channel/{print $2; exit}' rust-toolchain.toml)
          echo "pinned_channel ${channel}"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
          rustc --version
          rustc -vV
          cargo --version
          cargo -vV
          test "$(rustc --version | awk '{print $2}')" = "$channel"

      - name: Release spike-measure
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/measure-target
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          cargo build --manifest-path spikes/Cargo.toml -p spike-measure --release
          test "$(git rev-parse HEAD)" = "${{ needs.product.outputs.measure_ref }}"
          test -z "$(git status --porcelain)"

      - name: Record identity, architecture, and linked libraries
        if: always()
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/measure-target
        run: |
          set -euo pipefail
          bin="${CARGO_TARGET_DIR}/release/spike-measure"
          out="${RUNNER_TEMP}/measure-provenance"
          mkdir -p "$out"
          if [ ! -f "$bin" ]; then
            echo "role spike-measure" > "$out/provenance.txt"
            echo "built_source_sha $(git rev-parse HEAD)" >> "$out/provenance.txt"
            echo "release_binary absent" >> "$out/provenance.txt"
            exit 1
          fi
          cp "$bin" "$out/spike-measure"
          {
            echo "role spike-measure"
            echo "built_source_sha $(git rev-parse HEAD)"
            echo "measure_ref ${{ needs.product.outputs.measure_ref }}"
            echo "workflow_sha ${{ github.sha }}"
            echo "published_shell_source e1daf10bee77ecb24eb9e072c2d815e7ce86406b"
            echo "published_shell_sha256 61a4192996b99d44c9f3f618ba60273e1ab297b68908d5c004c664a5582ee95b"
            echo "not_a_spike_shell"
            if [ "$(git rev-parse HEAD)" = "e1daf10bee77ecb24eb9e072c2d815e7ce86406b" ]; then
              echo "product_rust_matches e1daf10bee77ecb24eb9e072c2d815e7ce86406b"
              echo "spike-shell not rebuilt"
            else
              echo "product_rust_matches no"
              echo "built_because_product_rust_changed"
            fi
            echo "source_subject $(git log -1 --format=%s)"
            echo "rustc $(rustc --version)"
            rustc -vV
            echo "cargo $(cargo --version)"
            cargo -vV
            echo "runner_arch $(uname -m)"
            uname -a
            sw_vers
            echo "host_target $(rustc -vV | awk '/^host:/{print $2}')"
            echo "binary_sha256 $(shasum -a 256 "$bin" | awk '{print $1}')"
            file "$bin"
            echo "--- otool -L ---"
            otool -L "$bin"
            echo "--- LC_BUILD_VERSION ---"
            otool -l "$bin" | awk '
              $1 == "cmd" && $2 == "LC_BUILD_VERSION" { show = 1 }
              show && $1 == "cmd" && $2 != "LC_BUILD_VERSION" { show = 0 }
              show { print }
            '
            if otool -L "$bin" | grep -i pdfium >/dev/null; then
              echo "pdfium_linked yes"
            else
              echo "pdfium_linked no"
            fi
          } > "$out/provenance.txt"
          otool -L "$bin" | awk 'NR > 1 && $1 != "" { print $1 }' > "$out/libs.txt"
          bad=0
          while IFS= read -r lib; do
            case "$lib" in
              /usr/lib/*|/System/Library/*) ;;
              *)
                echo "not a system library: $lib" | tee -a "$out/provenance.txt"
                bad=1
                ;;
            esac
          done < "$out/libs.txt"
          if [ "$bad" -ne 0 ]; then
            echo "mach_o_system_libs_only no" | tee -a "$out/provenance.txt"
            exit 1
          fi
          echo "mach_o_system_libs_only yes" | tee -a "$out/provenance.txt"
          echo "pdfium_is_runtime PDF still needs libpdfium.dylib from SPIKE_PDFIUM, the app Frameworks directory, or /tmp/pdfium/lib. This artifact does not include it. Static presence is not a load." | tee -a "$out/provenance.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-measure
          path: ${{ runner.temp }}/measure-provenance
          if-no-files-found: warn
