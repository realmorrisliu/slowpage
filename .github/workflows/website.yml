name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'spikes/justify/vendor/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'spikes/justify/vendor/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build Cloudflare Worker + assets
        run: pnpm build

      - name: Verify Cloudflare Build Output
        run: |
          test -f .cloudflare/output/v1/config.json
          test -f .cloudflare/output/v1/workers/default/assets/index.html
          test -f .cloudflare/output/v1/workers/default/assets/_i18n/en.html
          test -f .cloudflare/output/v1/workers/default/assets/robots.txt
          test -f .cloudflare/output/v1/workers/default/assets/sitemap.xml
          test -f .cloudflare/output/v1/workers/default/assets/og.png
          test -f .cloudflare/output/v1/workers/default/assets/og-en.png
          test -f .cloudflare/output/v1/workers/default/bundle/index.js
          grep -q "读得慢一点" .cloudflare/output/v1/workers/default/assets/index.html
          grep -q "Read slower." .cloudflare/output/v1/workers/default/assets/_i18n/en.html
