name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: spikes

jobs:
  fmt:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1
          rustup component add rustfmt --toolchain 1.98.1
          rustup default 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            spikes
            crates/superreader-typeset
      - run: cargo fmt -p spike-report -p spike-bold-word-starts -p spike-icon -p spike-library -- --check
      - run: cargo fmt -- --check
        working-directory: crates/superreader-typeset

  clippy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1
          rustup component add clippy --toolchain 1.98.1
          rustup default 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            spikes
            crates/superreader-typeset
      - run: cargo clippy -p spike-report --lib -- -D warnings
      - run: cargo clippy -p spike-bold-word-starts --all-targets -- -D warnings
      - run: cargo clippy -p spike-icon --all-targets -- -D warnings
      - run: cargo clippy -p spike-library --all-targets --features fixture -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: crates/superreader-typeset

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detach mount regression
        run: bash ../scripts/detach-mount.test.sh
      - name: Candidate version
        run: bash ../scripts/candidate-version.test.sh
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 && rustup default 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            spikes
            crates/superreader-typeset
      - run: cargo test -p spike-report -p spike-epub --lib -- --skip fixtures_open_on_chapter_text
      - run: cargo test -p spike-bold-word-starts
      - run: cargo test -p spike-library
      - name: Fetch pdfium
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            arm64) name=pdfium-mac-arm64.tgz ;;
            x86_64) name=pdfium-mac-x64.tgz ;;
            *) echo "no pdfium build for $arch" >&2; exit 1 ;;
          esac
          mkdir -p /tmp/pdfium
          curl -fsSL -L -o "/tmp/pdfium/$name" \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8125/$name"
          tar -xzf "/tmp/pdfium/$name" -C /tmp/pdfium
          test -f /tmp/pdfium/lib/libpdfium.dylib
      - run: cargo test -p spike-pdf --lib
      # nsh-platform-macos and objc2 need the macOS SDK on this macos-latest
      # runner. One package, not the workspace: spike-measure in the same
      # cargo command unifies taffy's features and fails the build.
      - name: Shell launch, break origin, and fullscreen decisions
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          log=$(mktemp)
          cargo test -p spike-shell --lib -- --test-threads=1 \
            a_stored_page_does_not_open_the_shelf_launch \
            an_explicit_file_resumes_its_stored_page \
            a_reader_forcing_launch_is_not_the_shelf_and_does_not_take_the_place \
            a_later_pass_keeps_the_origin_and_an_unmarked_pass_stays_unreported \
            fullscreen_waits_until_the_window_is_up_and_does_not_toggle_twice \
            epub_open_keeps_the_shelf_scroll_and_returns_the_page \
            the_switch_stays_on_webkit_until_the_typesetter_opens \
            a_turn_stops_at_the_chapter_ends \
            a_point_maps_into_the_paperback_page \
            selection_tints_paper_and_the_caret_is_ink \
            a_raster_keeps_its_aspect_inside_a_wider_page \
            pdf_open_keeps_the_shelf_scroll_and_returns_the_page \
            leave_keys_skip_editing_and_immersive \
            an_empty_path_and_a_bad_offset_do_not_move_the_shelf \
            the_shell_shows_the_library_or_the_existing_reader \
            a_wheel_on_the_reader_reaches_the_page_and_returns_to_the_shelf \
            a_file_open_while_running_switches_books_and_refuses_a_bad_file \
            a_page_key_turns_one_page_and_stops_at_the_ends \
            a_click_on_the_page_edge_turns_and_the_middle_does_not \
            a_reopen_keeps_the_sentence_on_the_same_page \
            a_stored_sentence_round_trips \
            a_chapter_choice_lands_on_that_sentence_and_returns \
            a_book_link_lands_on_the_sentence_and_returns \
            a_pending_fragment_keeps_the_origin_sentence \
            a_page_link_click_posts_the_character_offset \
            a_blocked_page_eases_back_to_the_same_column \
            a_blocked_ease_leaves_the_stored_sentence \
            a_fragment_waits_for_a_rect_then_posts_the_offset \
            a_reading_window_keeps_the_page_inside_the_card \
            reading_chrome_follows_the_pointer_and_drops_a_stale_hide \
            a_plain_launch_ignores_a_leftover_blur_file_and_writes_no_log \
            a_killed_verify_session_does_not_reach_the_next_plain_launch \
            the_status_log_stops_at_the_cap_and_stays_there \
            a_session_id_with_a_path_is_not_a_session \
            a_root_control_file_does_not_steer_a_launch_without_a_session \
            chinese_footer_matches_the_books_line \
            space_and_shift_space_use_the_existing_page_turn \
            a_title_or_author_query_filters_the_shelf_and_clears \
            a_trackpad_swipe_follows_cancels_and_commits_once \
            a_key_during_the_release_still_turns \
            a_direct_file_arms_the_wheel_without_the_shelf \
            a_release_stays_open_until_chapter_or_resize_cancels_it \
            a_reveal_during_the_release_does_not_post \
            a_delayed_reveal_does_not_let_the_lift_replace_the_pin \
            a_second_finger_key_keeps_the_committed_page \
            a_commit_post_names_its_token_and_a_second_finger_key_does_not_drop_it \
            a_long_chapter_commit_is_never_dropped \
            a_second_commit_and_a_long_chapter_post_every_token \
            a_finished_page_is_saved_before_chapter_or_resize \
            a_finished_swipe_is_the_place_a_later_open_reads \
            a_page_resume_does_not_store_the_columns_it_crosses \
            a_resume_walk_ends_when_the_reader_moves \
            a_taken_turn_is_the_page_the_resume_stops_on \
            a_resize_keeps_the_saved_page_until_the_anchor_lands \
            a_hold_reads_the_column_character \
            the_margin_keeps_its_state_across_818_and_the_narrow_page_stays \
            a_column_mode_does_not_move_the_page_frame \
            a_place_jump_keeps_the_first_origin \
            a_pdf_slide_keeps_the_departing_page_until_it_lands \
            a_pdf_turn_writes_the_landed_page_and_drops_a_changed_book \
            a_finger_moves_the_pdf_page_and_saves_when_the_glide_lands \
            a_typeset_finger_follows_the_webview_lift \
            a_new_book_drops_the_flying_token_and_saves_its_own_page \
            the_last_contents_choice_keeps_its_place_when_the_previous_document_posts \
            a_same_chapter_choice_keeps_its_sentence_when_the_old_turn_arrives \
            a_dismissed_book_does_not_write_the_book_now_open \
            the_last_pdf_contents_page_retires_the_glide_and_is_the_saved_page \
            a_covered_page_turns_on_the_visible_edge \
            live_resize_publishes_from_layout_in_common_modes \
            immersive_reading_keeps_the_page_across_escape_resize_and_fullscreen \
            an_immersive_ease_refits_once_and_drops_the_flying_page \
            margin_card_tokens_match_the_layout \
            a_wheel_on_the_margin_stays_with_the_cards \
            the_margin_keeps_the_departing_page_and_maps_its_line \
            a_broken_annotation_store_keeps_its_error \
            return_saves_the_margin_note_and_keeps_a_failed_draft \
            commit_card_updates_and_replies_through_the_support_file \
            a_second_draft_stays_visible_and_the_card_still_opens \
            a_closed_drawer_or_the_shelf_ends_composition_and_return_saves \
            a_selection_with_a_page_is_not_a_column_report \
            a_node_selection_posts_scalars_and_a_reflow_remeasures \
            shelf_enter_and_leave_follow_the_cosine \
            a_reverse_continues_from_the_current_progress \
            the_last_book_lands_and_a_missed_book_keeps_its_draft \
            the_cover_keeps_its_aspect_inside_each_window \
            a_narrow_window_does_not_squeeze_the_page \
            an_idle_pass_does_not_change_the_immersive_frame \
            a_continue_click_uses_that_card_and_a_shelf_click_uses_the_grid \
            the_immersive_landing_tick_is_emitted_after_the_trip_stops \
            the_clicked_cover_uses_the_shelf_that_is_showing \
            the_flight_starts_on_the_painted_cover \
            a_filtered_click_uses_the_painted_cover \
            a_file_open_does_not_keep_the_previous_cover \
            the_shelf_picture_owns_the_flight \
            a_pdf_goto_click_lands_on_the_page_and_keeps_one_return \
            an_outline_choice_lands_on_that_page_and_returns \
            the_reading_window_offers_a_back_control_and_all_books \
            a_sidebar_reverse_keeps_the_departing_card \
            | tee "$log"
          for name in \
            a_stored_page_does_not_open_the_shelf_launch \
            an_explicit_file_resumes_its_stored_page \
            a_reader_forcing_launch_is_not_the_shelf_and_does_not_take_the_place \
            a_later_pass_keeps_the_origin_and_an_unmarked_pass_stays_unreported \
            fullscreen_waits_until_the_window_is_up_and_does_not_toggle_twice \
            epub_open_keeps_the_shelf_scroll_and_returns_the_page \
            the_switch_stays_on_webkit_until_the_typesetter_opens \
            a_turn_stops_at_the_chapter_ends \
            a_point_maps_into_the_paperback_page \
            selection_tints_paper_and_the_caret_is_ink \
            a_raster_keeps_its_aspect_inside_a_wider_page \
            pdf_open_keeps_the_shelf_scroll_and_returns_the_page \
            leave_keys_skip_editing_and_immersive \
            an_empty_path_and_a_bad_offset_do_not_move_the_shelf \
            the_shell_shows_the_library_or_the_existing_reader \
            a_wheel_on_the_reader_reaches_the_page_and_returns_to_the_shelf \
            a_file_open_while_running_switches_books_and_refuses_a_bad_file \
            a_page_key_turns_one_page_and_stops_at_the_ends \
            a_click_on_the_page_edge_turns_and_the_middle_does_not \
            a_reopen_keeps_the_sentence_on_the_same_page \
            a_stored_sentence_round_trips \
            a_chapter_choice_lands_on_that_sentence_and_returns \
            a_book_link_lands_on_the_sentence_and_returns \
            a_pending_fragment_keeps_the_origin_sentence \
            a_page_link_click_posts_the_character_offset \
            a_blocked_page_eases_back_to_the_same_column \
            a_blocked_ease_leaves_the_stored_sentence \
            a_fragment_waits_for_a_rect_then_posts_the_offset \
            a_reading_window_keeps_the_page_inside_the_card \
            reading_chrome_follows_the_pointer_and_drops_a_stale_hide \
            a_plain_launch_ignores_a_leftover_blur_file_and_writes_no_log \
            a_killed_verify_session_does_not_reach_the_next_plain_launch \
            the_status_log_stops_at_the_cap_and_stays_there \
            a_session_id_with_a_path_is_not_a_session \
            a_root_control_file_does_not_steer_a_launch_without_a_session \
            chinese_footer_matches_the_books_line \
            space_and_shift_space_use_the_existing_page_turn \
            a_title_or_author_query_filters_the_shelf_and_clears \
            a_trackpad_swipe_follows_cancels_and_commits_once \
            a_key_during_the_release_still_turns \
            a_direct_file_arms_the_wheel_without_the_shelf \
            a_release_stays_open_until_chapter_or_resize_cancels_it \
            a_reveal_during_the_release_does_not_post \
            a_delayed_reveal_does_not_let_the_lift_replace_the_pin \
            a_second_finger_key_keeps_the_committed_page \
            a_commit_post_names_its_token_and_a_second_finger_key_does_not_drop_it \
            a_long_chapter_commit_is_never_dropped \
            a_second_commit_and_a_long_chapter_post_every_token \
            a_finished_page_is_saved_before_chapter_or_resize \
            a_finished_swipe_is_the_place_a_later_open_reads \
            a_page_resume_does_not_store_the_columns_it_crosses \
            a_resume_walk_ends_when_the_reader_moves \
            a_taken_turn_is_the_page_the_resume_stops_on \
            a_resize_keeps_the_saved_page_until_the_anchor_lands \
            a_hold_reads_the_column_character \
            the_margin_keeps_its_state_across_818_and_the_narrow_page_stays \
            a_column_mode_does_not_move_the_page_frame \
            a_place_jump_keeps_the_first_origin \
            a_pdf_slide_keeps_the_departing_page_until_it_lands \
            a_pdf_turn_writes_the_landed_page_and_drops_a_changed_book \
            a_finger_moves_the_pdf_page_and_saves_when_the_glide_lands \
            a_typeset_finger_follows_the_webview_lift \
            a_new_book_drops_the_flying_token_and_saves_its_own_page \
            the_last_contents_choice_keeps_its_place_when_the_previous_document_posts \
            a_same_chapter_choice_keeps_its_sentence_when_the_old_turn_arrives \
            a_dismissed_book_does_not_write_the_book_now_open \
            the_last_pdf_contents_page_retires_the_glide_and_is_the_saved_page \
            a_covered_page_turns_on_the_visible_edge \
            live_resize_publishes_from_layout_in_common_modes \
            immersive_reading_keeps_the_page_across_escape_resize_and_fullscreen \
            an_immersive_ease_refits_once_and_drops_the_flying_page \
            margin_card_tokens_match_the_layout \
            a_wheel_on_the_margin_stays_with_the_cards \
            the_margin_keeps_the_departing_page_and_maps_its_line \
            a_broken_annotation_store_keeps_its_error \
            return_saves_the_margin_note_and_keeps_a_failed_draft \
            commit_card_updates_and_replies_through_the_support_file \
            a_second_draft_stays_visible_and_the_card_still_opens \
            a_closed_drawer_or_the_shelf_ends_composition_and_return_saves \
            a_selection_with_a_page_is_not_a_column_report \
            a_node_selection_posts_scalars_and_a_reflow_remeasures \
            shelf_enter_and_leave_follow_the_cosine \
            a_reverse_continues_from_the_current_progress \
            the_last_book_lands_and_a_missed_book_keeps_its_draft \
            the_cover_keeps_its_aspect_inside_each_window \
            a_narrow_window_does_not_squeeze_the_page \
            an_idle_pass_does_not_change_the_immersive_frame \
            a_continue_click_uses_that_card_and_a_shelf_click_uses_the_grid \
            the_immersive_landing_tick_is_emitted_after_the_trip_stops \
            the_clicked_cover_uses_the_shelf_that_is_showing \
            the_flight_starts_on_the_painted_cover \
            a_filtered_click_uses_the_painted_cover \
            a_file_open_does_not_keep_the_previous_cover \
            the_shelf_picture_owns_the_flight \
            a_pdf_goto_click_lands_on_the_page_and_keeps_one_return \
            an_outline_choice_lands_on_that_page_and_returns \
            the_reading_window_offers_a_back_control_and_all_books \
            a_sidebar_reverse_keeps_the_departing_card
          do
            grep -E "test .*(::)?${name} \\.\\.\\. ok$" "$log"
          done
      - name: Cache typesetter fixture fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/superreader-fixtures/EBGaramond-Regular.ttf
            /tmp/superreader-fixtures/EBGaramond-Italic.ttf
            /tmp/superreader-fixtures/EBGaramond-Bold.ttf
            /tmp/superreader-fixtures/EBGaramond-BoldItalic.ttf
            /tmp/superreader-fixtures/NotoSerifCJKsc-Regular.otf
          key: typesetter-fonts-${{ hashFiles('scripts/fixtures-fonts.sh') }}
      - name: Fetch typesetter fonts
        working-directory: ${{ github.workspace }}
        run: |
          if ! command -v just >/dev/null; then
            brew install just
          fi
          just fixtures-fonts
      - name: Cache typesetter books
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/superreader-fixtures/pride-se.epub
            /tmp/superreader-fixtures/zhaohua.epub
          key: typesetter-books-se-pride-25271
      - name: Fetch admitted books
        run: |
          set -euo pipefail
          dest=/tmp/superreader-fixtures
          mkdir -p "$dest"
          fetch() {
            out="$1"
            shift
            if [ -s "$out" ]; then
              return 0
            fi
            for url in "$@"; do
              try=1
              while [ "$try" -le 4 ]; do
                if curl -fsSL -A "Mozilla/5.0" -o "$out" "$url"; then
                  return 0
                fi
                try=$((try + 1))
                sleep 3
              done
            done
            rm -f "$out"
            echo "network: could not download $out. This is not a product or chapter failure." >&2
            return 1
          }
          fetch "$dest/pride-se.epub" \
            "https://standardebooks.org/ebooks/jane-austen/pride-and-prejudice/downloads/jane-austen_pride-and-prejudice.epub?source=download"
          fetch "$dest/zhaohua.epub" \
            "https://gutenberg.pglaf.org/cache/epub/25271/pg25271.epub"
          # A cached copy with any other bytes is not the admitted file.
          if ! echo "91e59f1acb65d7bc77fa2d52fca8b223b893ad837f55c62de3e85fa848e0f293  $dest/zhaohua.epub" | shasum -a 256 -c -; then
            rm -f "$dest/zhaohua.epub"
            fetch "$dest/zhaohua.epub" \
              "https://gutenberg.pglaf.org/cache/epub/25271/pg25271.epub"
            if ! echo "91e59f1acb65d7bc77fa2d52fca8b223b893ad837f55c62de3e85fa848e0f293  $dest/zhaohua.epub" | shasum -a 256 -c -; then
              echo "fixture sha mismatch for $dest/zhaohua.epub. This is not a chapter assertion." >&2
              exit 1
            fi
          fi
      - name: Admitted chapter is the 范愛農 document
        run: python3 epub/fixtures/check_zhaohua.py
      - name: Open the admitted chapter
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          log=$(mktemp)
          cargo test -p spike-epub --lib fixtures_open_on_chapter_text -- --nocapture | tee "$log"
          grep -E "test .*fixtures_open_on_chapter_text \\.\\.\\. ok$" "$log"
      - run: cargo test
        working-directory: crates/superreader-typeset

  doc:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 && rustup default 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            spikes
            crates/superreader-typeset
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p spike-report -p spike-epub -p spike-bold-word-starts -p spike-library --no-deps
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
        working-directory: crates/superreader-typeset

  deny:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 && rustup default 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            spikes
            crates/superreader-typeset
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - run: cargo deny --config ../deny.toml check
        working-directory: spikes
      - run: cargo deny --config ../../deny.toml check
        working-directory: crates/superreader-typeset

  no-fast-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 40
      - name: Reject fast model ids in agent text
        working-directory: ${{ github.workspace }}
        run: sh scripts/lint-no-fast-models.sh
      - name: Harness gates
        working-directory: ${{ github.workspace }}
        run: sh scripts/harness-check
      - name: Prebuilt binary sha and source gate
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          log=$(mktemp)
          python3 -u scripts/verify --prebuilt-self-test | tee "$log"
          for line in \
            "prebuilt shell wrong_sha rejected" \
            "prebuilt measure wrong_sha rejected" \
            "prebuilt shell product_mismatch rejected" \
            "prebuilt measure product_mismatch rejected" \
            "prebuilt shell correct_source accepted" \
            "prebuilt measure correct_source accepted" \
            "prebuilt rejected_before_doctor" \
            "prebuilt rejected_before_build" \
            "prebuilt rejected_before_app" \
            "prebuilt unset cargo_default"
          do
            grep -F "$line" "$log"
          done

  bold-word-starts-ip:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 && rustup default 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: spikes
      - run: sh ../scripts/lint-bold-word-starts.sh

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 && rustup default 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            spikes
            crates/superreader-typeset
      - name: Phase 1 typography census
        working-directory: ${{ github.workspace }}
        run: bash scripts/typeset-census.sh
      - name: Upload the census
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typeset-census
          path: docs/design/typeset-gate/ci
          if-no-files-found: warn
